name: Publish Images and Charts

# Continuous publish on main. Builds and publishes:
#   - Five container images at ghcr.io/soctalk/soctalk-* tagged `latest`
#     + short SHA. Versioned (X.Y.Z) release images are cut separately by
#     `cut-k8s-release.yml`.
#   - Four Helm charts (soctalk-system, soctalk-tenant, wazuh, linux-ep)
#     as OCI artifacts at ghcr.io/soctalk/charts/<chart>:
#       * a per-commit pre-release `<Chart.yaml version>-main.g<short sha>`
#         on every push (what deploy-demo.yml deploys), and
#       * the plain `<Chart.yaml version>` only if it does not exist yet
#         (the version-bump commit). A released version is never
#         overwritten from main: `helm push` of an existing version
#         REPLACES it on an OCI registry, which silently changed the
#         released charts' content after every merge. cut-k8s-release.yml
#         is the one place that re-pushes X.Y.Z, deliberately.
#
# Triggered on:
#   - push to main         → publishes `latest`+sha images, the charts' main pre-release, and X.Y.Z charts that are new
#   - workflow_dispatch    → manual button; useful for the first publish
#
# Versioned releases (images + charts + GitHub Release): use the
# `cut-k8s-release.yml` action. Demo VM images: `build-packer-images.yml`.
#
# First-time setup: after the first successful run, flip each ghcr package
# to public visibility at https://github.com/orgs/soctalk/packages
# (or via `gh api -X PATCH /orgs/soctalk/packages/container/<name> -f visibility=public`).

on:
  push:
    branches: [main]
    # Versioned releases (X.Y.Z-tagged images + charts + GitHub Release)
    # are cut by the dedicated `cut-k8s-release.yml` action, NOT by a tag
    # push here — so cutting a k8s release stays decoupled from the Packer
    # VM build. This workflow only publishes the moving `latest` + short-
    # sha images and the charts' per-commit pre-release versions on every
    # main push (which is what auto-updates demo via deploy-demo.yml).
    # Skip image rebuilds when the change touches only docs, tests, or
    # the soctalk-docs site. Saves CI minutes and avoids re-publishing
    # the same image bits on a doc tweak.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tests/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/workflows/v1-ci.yml'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag (e.g. 0.1.0). Always also tagged `latest` and short SHA."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: soctalk-api
            dockerfile: Dockerfile
            context: .
          - image: soctalk-app-ui
            dockerfile: Dockerfile.app
            context: .
          - image: soctalk-orchestrator
            dockerfile: Dockerfile.orchestrator
            context: .
          - image: soctalk-adapter
            dockerfile: Dockerfile.adapter
            context: .
          - image: soctalk-linux-ep
            dockerfile: attack-simulator/Dockerfile
            context: attack-simulator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          image="ghcr.io/soctalk/${{ matrix.image }}"
          short_sha="${GITHUB_SHA::7}"
          tags=("$image:latest" "$image:$short_sha")
          if [[ -n "${{ inputs.tag }}" ]]; then
            tags+=("$image:${{ inputs.tag }}")
          fi
          printf '%s\n' "${tags[@]}"
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          provenance: false

  charts:
    runs-on: ubuntu-latest
    # Charts publish independently of images; they don't need images to
    # build, only to run. So we don't `needs: build`.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Log in to ghcr.io (Helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and push charts
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP:-/tmp}/helm-out"
          rm -rf "$out"; mkdir -p "$out/release" "$out/prerelease"
          # `g` keeps the SemVer pre-release identifier alphanumeric: a short
          # SHA can be all digits with a leading zero, which SemVer forbids.
          short_sha="${GITHUB_SHA::7}"

          # soctalk-tenant depends on wazuh + linux-ep via file:// refs.
          # `helm package` won't traverse those without a resolved deps
          # directory, so run `dependency update` first — it copies the
          # referenced sibling charts into charts/soctalk-tenant/charts/.
          echo "::group::dependency update soctalk-tenant"
          helm dependency update charts/soctalk-tenant
          echo "::endgroup::"

          for chart in soctalk-system soctalk-tenant wazuh linux-ep; do
            ver="$(awk '/^version:/ {print $2; exit}' "charts/$chart/Chart.yaml")"
            pre="${ver}-main.g${short_sha}"
            echo "::group::package $chart ($ver, $pre)"
            # Released versions are immutable. `helm push` of an existing
            # version replaces it on an OCI registry (it is NOT a no-op), so
            # only publish X.Y.Z when the registry does not have it yet. Any
            # lookup error other than "not found" fails the job rather than
            # risk overwriting a release.
            if err="$(helm show chart "oci://ghcr.io/soctalk/charts/$chart" --version "$ver" 2>&1 >/dev/null)"; then
              echo "$chart $ver is already published; leaving it untouched"
            elif grep -qi "not found" <<<"$err"; then
              helm package "charts/$chart" --destination "$out/release"
            else
              echo "::error::cannot tell whether $chart $ver is published: $err"
              exit 1
            fi
            helm package "charts/$chart" --version "$pre" --destination "$out/prerelease"
            echo "::endgroup::"
          done

          for tgz in "$out"/release/*.tgz "$out"/prerelease/*.tgz; do
            [ -e "$tgz" ] || continue
            echo "::group::push $(basename "$tgz")"
            helm push "$tgz" oci://ghcr.io/soctalk/charts
            echo "::endgroup::"
          done
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "Charts for this commit: \`<chart>@$(awk '/^version:/ {print $2; exit}' charts/soctalk-system/Chart.yaml)-main.g${short_sha}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
